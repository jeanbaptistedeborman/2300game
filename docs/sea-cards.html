<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=width, initial-scale=1.0">
  <title>Sea Cards</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap');

    body {
      background: #f0f0f0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Crimson Pro', serif;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .cards-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      padding: 0;
    }
    .card {
      width: 8.5cm;
      height: 7cm;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Crimson Pro', serif;
      font-size: 1.2em;
      color: #fff;
      position: relative;
      overflow: hidden;
      margin: 0;
      border: 1px solid #0a2a4a;
      break-inside: avoid;
      page-break-inside: avoid;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .card-wrapper {
      position: relative;
      display: inline-block;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    /* right margin strip: a vertical line separating the map area from the number tab */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 1.8cm;
      width: 1px;
      height: 100%;
      background: rgba(255,255,255,0.35);
      pointer-events: none;
    }
    .card-number {
      position: absolute;
      top: 0.3cm;
      right: 0.15cm;
      transform: none;
      font-size: 1.3cm;
      font-weight: bold;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 2;
      pointer-events: none;
      user-select: none;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    /* Simple solid SEA color backgrounds */
    .sea-arctic {
      background-color: #5ba8e0;
      color: #fff;
    }
    .sea-atlantic {
      background-color: #5ba8e0;
      color: #fff;
    }
    .sea-pacific {
      background-color: #5ba8e0;
      color: #fff;
    }
    .sea-indian {
      background-color: #5ba8e0;
      color: #fff;
    }
    .sea-equatorial {
      width: 15.5cm;
      height: 7cm !important;
      background-color: #5ba8e0;
      color: #fff;
    }

      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .card-arrow {
      position: absolute;
      top: 50%;
      right: 0.85cm;
      width: 1.1cm;
      height: 1.1cm;
      transform: translateY(-50%) rotate(90deg);
      z-index: 3;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sea-equatorial .card-placeholder {
      width: calc(7cm - 5mm);
      height: calc(7cm - 5mm);
      position: absolute;
      top: 50%;
    }
    .sea-equatorial .card-placeholder-left {
      /* centre of left half of the 14cm content area */
      left: calc(14cm / 4);
      transform: translate(-50%, -50%);
    }
    .sea-equatorial .card-placeholder-right {
      /* centre of right half of the 14cm content area */
      left: calc(14cm * 3 / 4);
      transform: translate(-50%, -50%);
    }
    .equatorial-arrows {
      position: absolute;
      bottom: 0.3cm;
      left: 0;
      width: 14cm;
      height: 2cm;
      z-index: 3;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .eq-arrows-svg {
      width: 5cm;
      height: 3cm;
      overflow: visible;
    }
    .card-arrow svg {
      width: 100%;
      height: 100%;
    }
    .card-label {
      position: absolute;
      left: 0;
      right: 1.5cm;
      bottom: 0.4cm;
      text-align: center;
      font-size: 0.7cm;
      font-weight: bold;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
      letter-spacing: 0.05em;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }

    /* ── Mirrored cards ── */
    .card-mirror::after {
      right: auto;
      left: 1.8cm;
    }
    .card-mirror .card-number {
      right: auto;
      left: 0.15cm;
    }
    .card-mirror .card-placeholder {
      /* centred in the content zone (right of the left margin strip) */
      left: calc(1.8cm + (8.5cm - 1.8cm) / 2);
    }
    .card-mirror .card-arrow {
      left: 0.85cm;
      right: auto;
      transform: translateY(-50%) rotate(-90deg);
    }
    /* mirrored equatorial: number on left, placeholders in right 14cm zone */
    .card-mirror.sea-equatorial::after {
      right: auto;
      left: 1.5cm;
    }
    .card-mirror.sea-equatorial .card-placeholder-left {
      left: calc(1.5cm + 14cm / 4);
    }
    .card-mirror.sea-equatorial .card-placeholder-right {
      left: calc(1.5cm + 14cm * 3 / 4);
    }
    .card-mirror .equatorial-arrows {
      left: 1.5cm;
      width: 14cm;
    }
    /* ── Route latérale / Routes équatoriales label ── */
    .route-label {
      position: absolute;
      right: 0;
      width: 1.8cm;
      bottom: 0.2cm;
      top: auto;
      height: 50%;
      justify-content: center;
      font-family: 'Crimson Pro', serif;
      font-size: 0.5cm;
      line-height: 1.1;
      font-style: italic;
      font-weight: 800;
      color: rgba(255,255,255,0.9);
      writing-mode: vertical-rl;
      transform: none;
      letter-spacing: 0.03em;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      padding: 0.2cm 0;
      box-sizing: border-box;
      white-space: normal;
      word-break: break-word;
      text-align: center;
    }
    /* mirrored: label on the left side, reads bottom-to-top */
    .card-mirror .route-label {
      right: auto;
      left: 0;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      align-items: center;
    }
    .sea-thumb {
      position: absolute;
      width: 0.7cm;
      height: 0.9cm;
      border-radius: 3px;
      border: 1.5px solid rgba(255,255,255,0.95);
      box-shadow: 0 2px 6px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.2);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Crimson Pro', serif;
      font-weight: bold;
      font-size: 0.38cm;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      z-index: 4;
      pointer-events: none;
      user-select: none;
      /* Sits at right edge — arrow points right into it */
      right: 0.2cm;
      top: 50%;
      transform: translateY(-50%);
    }
    .card-mirror .sea-thumb {
      right: auto;
      left: 0.2cm;
      top: 50%;
      transform: translateY(-50%);
    }
    /* ── Equatorial sea-thumb positions ── */
    /* 5 thumbs: top-left, top-center, top-right (row), left-center, right-center */
    .eq-thumb { position: absolute; z-index: 5; }
    .eq-thumb-top-left  { top: 0.15cm; left: 2.2cm; }
    .eq-thumb-top-mid   { top: 0.15cm; left: calc(50% - 0.35cm); }
    .eq-thumb-top-right { top: 0.15cm; right: 2.2cm; }
    .eq-thumb-left      { top: calc(50% - 0.45cm); left: 0.05cm; }
    .eq-thumb-right     { top: calc(50% - 0.45cm); right: 1.6cm; }
    /* mirrored equatorial */
    .card-mirror .eq-thumb-left  { left: 1.6cm; }
    .card-mirror .eq-thumb-right { right: 0.05cm; }
    .thumb-1 { background-color: #f0d000; color: #222 !important; text-shadow: none !important; }
    .thumb-2 { background-color: #232526; }
    .thumb-3 { background-color: #d47800; color: #222 !important; text-shadow: none !important; }
    .thumb-4 { background-color: #ff003c; }
    .thumb-5 { background-color: #1e90ff; }

    /* Fan SVG filling the placeholder */
    .ph-fan-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      overflow: hidden;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body {
        background: none;
        margin: 0;
        padding: 0;
        box-shadow: none;
        width: 190mm; /* A4 210mm - 2×10mm margins */
      }
      .cards-container {
        gap: 0;
        padding: 0;
