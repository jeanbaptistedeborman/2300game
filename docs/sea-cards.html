<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=width, initial-scale=1.0">
  <title>Sea Cards</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap');
    body {
      background: #f0f0f0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Crimson Pro', serif;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .cards-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      padding: 0;
    }
    .card {
      width: 6.7cm;
      height: 7cm;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Crimson Pro', serif;
      font-size: 1.2em;
      color: #fff;
      position: relative;
      overflow: hidden;
      margin: 0;
      border: 1px solid #0a2a4a;
      break-inside: avoid;
      page-break-inside: avoid;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .card-wrapper {
      position: relative;
      display: inline-block;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .card-number {
      position: absolute;
      left: 0.3cm;
      top: 0.3cm;
      transform: none;
      font-size: 0.9cm;
      font-weight: bold;
      color: #1a2a4a;
      padding: 0.05cm 0.15cm;
      border-radius: 3px;
      text-shadow: none;
      z-index: 5;
      pointer-events: none;
      user-select: none;
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      line-height: 1;
    }
    .sea-arctic {
      --sea-color: #f0d000;
      background-color: #4eadad;
      color: #fff;
    }
    .sea-atlantic {
      --sea-color: #232526;
      background-color: #4eadad;
      color: #fff;
    }
    .sea-pacific {
      --sea-color: #d47800;
      background-color: #4eadad;
      color: #fff;
    }
    .sea-indian {
      --sea-color: #ff003c;
      background-color: #4eadad;
      color: #fff;
    }
    .sea-equatorial {
      --sea-color: #1e90ff;
      background-color: #4eadad;
      color: #fff;
    }

    .route-label {
      display: none;
      right: 0;
      width: 1.5cm;
      bottom: 0.2cm;
      top: auto;
      height: 50%;
      justify-content: center;
      font-family: 'Crimson Pro', serif;
      font-size: 0.5cm;
      line-height: 1.1;
      font-style: italic;
      font-weight: 800;
      color: rgba(255,255,255,0.9);
      writing-mode: vertical-rl;
      transform: none;
      letter-spacing: 0.03em;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      padding: 0.2cm 0;
      box-sizing: border-box;
      white-space: normal;
      word-break: break-word;
      text-align: center;
    }
    .card-number,
    .placeholder-arrow,
    .placeholder-boat,
    .ph-fan-svg,
    .sea-arctic .card-placeholder,
    .sea-atlantic .card-placeholder,
    .sea-pacific .card-placeholder,
    .sea-indian .card-placeholder,
    .sea-equatorial .card-placeholder {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .placeholder-arrow {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 3.2cm;
      height: 0.65cm;
      bottom: 0.2cm;
      pointer-events: none;
      overflow: visible;
    }
    .placeholder-boat {
      position: absolute;
      width: 0.75cm;
      height: 0.75cm;
      left: 50%;
      transform: translateX(-50%);
      bottom: 1cm;
      z-index: 5;
      pointer-events: none;
      overflow: visible;
    }
    .ph-fan-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      overflow: hidden;
    }
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body {
        background: none;
        margin: 0;
        padding: 0;
        box-shadow: none;
        width: 190mm;
      }
      .cards-container {
        gap: 0;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: flex-start;
        width: 190mm;
        page-break-after: always;
        break-after: page;
      }
      .cards-container:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .card-wrapper {
        margin: 0;
        display: block;
      }
      .card {
        box-shadow: none;
        margin: 0;
        border: 1px solid var(--sea-color, #0a2a4a);
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
